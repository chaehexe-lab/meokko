<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STEP2 준비중</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --ink: #18201d;
      --muted: #69736f;
      --line: #dfe4df;
      --panel: #ffffff;
      --green: #225d45;
      --shadow: 0 18px 55px rgba(37, 63, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      word-break: keep-all;
    }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      border-bottom: 1px solid rgba(24, 32, 29, .08);
      background: rgba(244, 246, 243, .9);
      backdrop-filter: blur(16px);
    }
    .topbar-inner { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 900; }
    .brand-mark { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: var(--green); font-size: 12px; }
    a { color: inherit; text-decoration: none; }
    .back { padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--green); background: #fff; font-size: 12px; font-weight: 900; }
    main { min-height: calc(100vh - 59px); display: grid; place-items: center; padding: 40px 0; }
    .placeholder {
      width: min(560px, 100%);
      padding: 46px 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .placeholder small {
      color: var(--green);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .08em;
    }
    h1 {
      margin: 14px 0 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      letter-spacing: -.05em;
    }
    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.6;
    }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1180px); }
      .topbar-inner { min-height: 54px; }
      .placeholder { padding: 38px 20px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand"><span class="brand-mark">ME</span><span>Meokko Insight · STEP2</span></div>
      <a class="back" href="index.html">STEP1로 돌아가기</a>
    </div>
  </header>

  <main class="shell">
    <section class="placeholder" aria-label="STEP2 준비 상태">
      <small>STEP2</small>
      <h1>아직 준비중...</h1>
      <p>콘텐츠 추천 생성 화면은 다음 단계에서 연결됩니다.</p>
    </section>
  </main>
</body>
</html>
